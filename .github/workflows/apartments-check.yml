name: Проверка квартир
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/apartments-check.yml'
concurrency:
  group: apartments-${{ github.head_ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и тесты
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Ошибки тестов
        if: failure()
        run: |
          python3 - <<'PYTESTLOG'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(root.attrib.get('name'), case.attrib.get('name'))
                      print((failure.text or '')[:14000])
          PYTESTLOG
      - name: Сгенерированная схема
        if: always()
        run: |
          echo 'ROOM_SCHEMA_BEGIN'
          cat app/schemas/ru.my.traty.data.AppDatabase/17.json || true
          echo 'ROOM_SCHEMA_END'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apartments-check
          path: |
            app/schemas/
            app/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
